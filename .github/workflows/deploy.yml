name: Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload Originals and Deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GALLERY_DESCRIPTION: ${{ vars.GALLERY_DESCRIPTION }}
      GALLERY_OUTPUT_DIR: dist
      GALLERY_SOURCE_DIR: photos
      GALLERY_TITLE: ${{ vars.GALLERY_TITLE }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ORIGINAL_PREFIX: ${{ vars.S3_ORIGINAL_PREFIX }}
      S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Node dependencies cache
        id: node-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: node-22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Configure Git LFS
        run: git lfs install --local --skip-smudge

      - name: Compute cache date key
        id: cache-date
        run: |
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore photos content cache
        uses: actions/cache@v4
        with:
          path: .photos-cache
          key: photos-${{ steps.cache-date.outputs.day }}-${{ github.sha }}
          restore-keys: |
            photos-${{ steps.cache-date.outputs.day }}-
            photos-${{ steps.cache-date.outputs.month }}-
            photos-${{ steps.cache-date.outputs.year }}-
            photos-

      - name: Hydrate Git LFS photos
        run: npm run hydrate:photos

      - name: Restore gallery build cache
        uses: actions/cache@v4
        with:
          path: .gallery-cache
          key: gallery-cache-${{ hashFiles('src/**/*.ts', 'scripts/**/*.ts', 'package-lock.json') }}-${{ steps.cache-date.outputs.day }}-${{ github.sha }}
          restore-keys: |
            gallery-cache-${{ hashFiles('src/**/*.ts', 'scripts/**/*.ts', 'package-lock.json') }}-${{ steps.cache-date.outputs.day }}-
            gallery-cache-${{ hashFiles('src/**/*.ts', 'scripts/**/*.ts', 'package-lock.json') }}-${{ steps.cache-date.outputs.month }}-
            gallery-cache-${{ hashFiles('src/**/*.ts', 'scripts/**/*.ts', 'package-lock.json') }}-${{ steps.cache-date.outputs.year }}-
            gallery-cache-

      - name: Upload originals
        run: npm run upload

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name gallery --branch master --commit-hash "${{ github.sha }}"
